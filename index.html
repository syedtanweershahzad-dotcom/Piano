<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎹 Piano</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="intro">
      <h1>🎹 Piano</h1>
      <h3>24 keys · click or use your keyboard</h3>
      <div class="hint">
        <span>shortcuts:</span>
        <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd>
        <kbd>D</kbd><kbd>F</kbd><kbd>T</kbd><kbd>G</kbd>
        <kbd>Y</kbd><kbd>H</kbd><kbd>U</kbd><kbd>J</kbd>
        <span class="dot">•</span>
        <kbd>K</kbd><kbd>O</kbd><kbd>L</kbd><kbd>P</kbd>
        <kbd>;</kbd><kbd>'</kbd><kbd>Z</kbd><kbd>X</kbd>
        <kbd>C</kbd><kbd>V</kbd><kbd>B</kbd><kbd>N</kbd>
      </div>
    </div>

    <!-- PIANO -->
    <div class="piano-wrap">
      <ul class="piano" id="piano"></ul>
    </div>

    <div class="footer">
      <span>✦</span> click or type <span>✦</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
